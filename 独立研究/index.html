<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>书影音推荐</title>
  <link rel="stylesheet" href="css/course.css">
</head>
<body>
  <header>
    <h1>书影音推荐</h1>
    <p>欢迎来到我的推荐</p>
  </header>
  <nav>
    <a href="#book">书籍</a>
    <a href="#film">电影</a>
    <a href="#music">音乐</a>
  </nav>
  <main>
    <section id="book">
      <h2>书籍</h2>
        <div class="card-wall">
          <article class="card">
            <h3>《围城》 钱钟书</h3>
            <p>围在城里的想逃出来，城外的人想冲进去。</p>
            <img src="images/围城.jpg" alt="围城" width="200" height="auto">
          </article>
          <article class="card">
            <h3>《西行漫记》 埃德加·斯诺</h3>
            <p>只要还有一口气，就要为共产主义事业奋斗到底。</p>
            <img src="images/西行漫记.jpg" alt="西行漫记" width="200" height="auto">
          </article>
        </div>
    </section>
    <section id="film">
      <h2>电影</h2>
        <div class="card-wall">
          <article class="card">
            <h3>《肖申克的救赎》</h3>
            <p>希望是美好的，也许是人间至善，而美好的事物永不消逝。</p>
            <img src="images/肖申克的救赎.jpg" alt="肖申克的救赎" width="200" height="auto">
          </article>
          <article class="card">
            <h3>《欢迎来龙餐馆》</h3>
            <p>好好吃饭，比啥都强。</p>
            <img src="images/欢迎来龙餐馆.jpg" alt="欢迎来龙餐馆" width="200" height="auto">
          </article>
        </div>
    </section>
    <section id="music">
      <h2>音乐</h2>
        <div class="card-wall">
            <article class="card">
              <h3>《混入人类计划》 Chilichill</h3>
              <p>“一生都在遇到问题 有时候永远也找不到谜底”</p>
              <img src="images/混入人类计划.jpg" alt="混入人类计划" width="200" height="auto">
            </article>
            <article class="card">
              <h3>《入秋的第一场雨真让人矫情》 Chilichill</h3>
              <p>“暧昧和错过 幼稚和脆弱 融进了雨水浇醒落灰的遗憾”</p>
              <img src="images/入秋的第一场雨真让人矫情.jpg" alt="入秋的第一场雨真让人矫情" width="200" height="auto">
            </article>
        </div>
    </section>
  </main>
  <footer>
    <p>如有侵权，敬请告知</p>
  </footer>
</body>
</html>
