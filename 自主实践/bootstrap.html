<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>书影音推荐</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/course.css">
</head>
<body>
    <header class="container my-header">
        <h1>书影音推荐</h1>
        <p>欢迎来到我的推荐</p>
    </header>
    <nav class="container d-flex flex-wrap my-nav">
        <a href="#book">书籍</a>
        <a href="#film">电影</a>
        <a href="#music">音乐</a>
    </nav>
    <main class="container">
        <section id="book" class="my-section">
            <h2>书籍</h2>
            <div class="row g-3">
                <div class="col-md-6 col-lg-4">
                    <div class="card my-card">
                        <img src="images/围城.jpg" class="card-img-top" alt="围城">
                        <div class="card-body">
                            <h5 class="card-title">《围城》 钱钟书</h5>
                            <p class="card-text">围在城里的想逃出来，城外的人想冲进去。</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 col-lg-4">
                    <div class="card my-card">
                        <img src="images/西行漫记.jpg" class="card-img-top" alt="西行漫记">
                        <div class="card-body">
                            <h5 class="card-title">《西行漫记》 埃德加·斯诺</h5>
                            <p class="card-text">只要还有一口气，就要为共产主义事业奋斗到底。</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section id="film" class="my-section">
            <h2>电影</h2>
            <div class="row g-3">
                <div class="col-md-6 col-lg-4">
                    <div class="card my-card">
                        <img src="images/肖申克的救赎.jpg" class="card-img-top" alt="肖申克的救赎">
                        <div class="card-body">
                            <h5 class="card-title">《肖申克的救赎》</h5>
                            <p class="card-text">希望是美好的，也许是人间至善，而美好的事物永不消逝。</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 col-lg-4">
                    <div class="card my-card">
                        <img src="images/欢迎来龙餐馆.jpg" class="card-img-top" alt="欢迎来龙餐馆">
                        <div class="card-body">
                            <h5 class="card-title">《欢迎来龙餐馆》</h5>
                            <p class="card-text">好好吃饭，比啥都强。</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section id="music" class="my-section">
            <h2>音乐</h2>
            <div class="row g-3">
                <div class="col-md-6 col-lg-4">
                    <div class="card my-card">
                        <img src="images/混入人类计划.jpg" class="card-img-top" alt="混入人类计划">
                        <div class="card-body">
                            <h5 class="card-title">《混入人类计划》 Chilichill</h5>
                            <p class="card-text">"一生都在遇到问题 有时候永远也找不到谜底"</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 col-lg-4">
                    <div class="card my-card">
                        <img src="images/入秋的第一场雨真让人矫情.jpg" class="card-img-top" alt="入秋的第一场雨真让人矫情">
                        <div class="card-body">
                            <h5 class="card-title">《入秋的第一场雨真让人矫情》 Chilichill</h5>
                            <p class="card-text">"暧昧和错过 幼稚和脆弱 融进了雨水洗醒落灰的遗憾"</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <p>如有侵权，敬请告知</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
